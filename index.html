
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CastleDrop — Upload Tracker</title>
  <style>
    :root {
      --bg:        #f5f5f5;
      --surface:   #ffffff;
      --border:    #e0e0e0;
      --gold:      #b8860b;
      --gold-light:#d4a017;
      --text:      #1a1a1a;
      --muted:     #666666;
      --green:     #1a7a3c;
      --red:       #c0392b;
      --yellow:    #b7791f;
      --accent:    #b8860b;
      --radius:    8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      padding-bottom: 60px;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 2px solid var(--border);
      padding: 22px 36px;
    }
    .brand-name {
      font-size: 1.7rem;
      font-weight: 800;
      color: var(--gold);
      letter-spacing: -.5px;
      line-height: 1;
    }
    .brand-sub {
      font-size: .78rem;
      color: var(--muted);
      margin-top: 3px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
    .brand-tag {
      font-size: .7rem;
      color: var(--muted);
      margin-top: 2px;
      font-style: italic;
    }

    /* ── Stats bar ── */
    .stats {
      display: flex;
      gap: 14px;
      padding: 20px 36px;
      flex-wrap: wrap;
    }
    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 22px;
      min-width: 120px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .stat-label {
      font-size: .68rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .stat-value {
      font-size: 1.6rem;
      font-weight: 700;
      margin-top: 3px;
      color: var(--text);
    }
    .stat-value.green   { color: var(--green); }
    .stat-value.red     { color: var(--red);   }
    .stat-value.yellow  { color: var(--yellow);}
    .stat-value.gold    { color: var(--gold);  }

    /* ── Main ── */
    .main { padding: 0 36px; display: flex; flex-direction: column; gap: 24px; }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .card-title {
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--gold);
      margin-bottom: 18px;
      font-weight: 700;
    }

    /* ── Form ── */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
      gap: 14px;
      margin-bottom: 16px;
    }
    .form-full { grid-column: 1 / -1; }
    label { display: block; font-size: .75rem; color: var(--muted); margin-bottom: 5px; font-weight: 600; }
    input, select, textarea {
      width: 100%;
      background: #fafafa;
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text);
      padding: 9px 11px;
      font-size: .875rem;
      font-family: inherit;
      transition: border-color .2s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--gold);
      background: #fff;
    }
    textarea { resize: vertical; min-height: 68px; }

    .form-actions { display: flex; gap: 10px; }
    button {
      cursor: pointer;
      border: none;
      border-radius: 5px;
      font-size: .85rem;
      font-weight: 600;
      padding: 9px 22px;
      font-family: inherit;
      transition: opacity .15s, box-shadow .15s;
    }
    button:hover { opacity: .88; }
    .btn-primary { background: var(--gold); color: #fff; }
    .btn-cancel  { background: #e8e8e8; color: var(--muted); }

    /* ── Table ── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .83rem; }
    thead th {
      text-align: left;
      padding: 10px 13px;
      font-size: .67rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      border-bottom: 2px solid var(--border);
      white-space: nowrap;
      font-weight: 700;
      background: #fafafa;
    }
    tbody tr { border-bottom: 1px solid var(--border); transition: background .15s; }
    tbody tr:hover { background: #fdf8ee; }
    tbody td { padding: 11px 13px; vertical-align: top; color: var(--text); }
    .td-note   { color: var(--muted); font-size: .78rem; font-style: italic; max-width: 200px; }
    .td-amount { font-variant-numeric: tabular-nums; font-weight: 600; }
    .td-vendor { font-weight: 600; }

    /* ── Badges ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: .73rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .badge-yes          { background: #e6f4ec; color: var(--green);  border: 1px solid #b7dfc6; }
    .badge-no           { background: #fdecea; color: var(--red);    border: 1px solid #f5c0bb; }
    .badge-pending      { background: #f0f0f0; color: var(--muted);  border: 1px solid #d0d0d0; }
    .badge-inprogress   { background: #e8f0fe; color: #3a5bc7;       border: 1px solid #c7d0f0; }
    .badge-qualitycheck { background: #fff4e0; color: #b7791f;       border: 1px solid #f5dfa0; }
    .badge-approved     { background: #e6f4ec; color: var(--green);  border: 1px solid #b7dfc6; }
    .badge-exported     { background: #f0e8fe; color: #7c3aed;       border: 1px solid #d5b8f8; }
    .badge-paid         { background: #fef9e0; color: #b8860b;       border: 1px solid #f0d57a; }

    /* ── Row actions ── */
    .row-actions { display: flex; gap: 6px; }
    .btn-edit   { background: #eef1fb; color: #3a5bc7; padding: 5px 11px; font-size: .73rem; border: 1px solid #c7d0f0; }
    .btn-delete { background: #fdecea; color: var(--red);  padding: 5px 11px; font-size: .73rem; border: 1px solid #f5c0bb; }

    /* ── Empty ── */
    .empty { text-align: center; padding: 48px 24px; color: var(--muted); }
    .empty .icon { font-size: 2.4rem; margin-bottom: 10px; }

    /* ── Modal ── */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.35);
      backdrop-filter: blur(3px);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      width: min(520px, 94vw);
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 8px 32px rgba(0,0,0,.15);
    }
    .modal h2 {
      font-size: 1rem;
      margin-bottom: 20px;
      color: var(--gold);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ── Fix button ── */
    .btn-fix {
      background: #fff8e1;
      color: #b8860b;
      border: 1px solid #f5dfa0;
      padding: 6px 14px;
      font-size: .75rem;
      border-radius: 5px;
    }
    .btn-fix:hover { background: #fef3dc; }

    /* ── Filter bar ── */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .filter-bar label { margin-bottom: 0; white-space: nowrap; }
    .filter-bar select { width: auto; min-width: 150px; }
    .btn-clear {
      background: #e8e8e8;
      color: var(--muted);
      padding: 8px 16px;
      font-size: .8rem;
      border: 1px solid var(--border);
    }
    .filter-count {
      font-size: .78rem;
      color: var(--muted);
      margin-left: auto;
      font-style: italic;
    }

    @media (max-width: 600px) {
      header, .stats, .main { padding-left: 16px; padding-right: 16px; }
      .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <div class="brand-name">CastleDrop</div>
  <div class="brand-sub">Upload Tracker</div>
  <div class="brand-tag">Internal Use Only</div>
</header>

<div class="stats">
  <div class="stat">
    <div class="stat-label">Total</div>
    <div class="stat-value gold" id="stat-total">—</div>
  </div>
  <div class="stat">
    <div class="stat-label">Success</div>
    <div class="stat-value green" id="stat-yes">—</div>
  </div>
  <div class="stat">
    <div class="stat-label">Failed</div>
    <div class="stat-value red" id="stat-no">—</div>
  </div>
  <div class="stat">
    <div class="stat-label">Pending</div>
    <div class="stat-value yellow" id="stat-pending">—</div>
  </div>
</div>

<div class="main">

  <!-- Add form -->
  <div class="card">
    <div class="card-title">// Add Upload Record</div>
    <div class="form-grid">
      <div>
        <label>Vendor Name</label>
        <input id="f-vendor" type="text" placeholder="ACME Corp" />
      </div>
      <div>
        <label>Invoice #</label>
        <input id="f-invoice" type="text" placeholder="INV-0001" />
      </div>
      <div>
        <label>Amount ($)</label>
        <input id="f-amount" type="number" placeholder="0.00" step="0.01" min="0" />
      </div>
      <div>
        <label>Date Received</label>
        <input id="f-received" type="date" />
      </div>
      <div>
        <label>Date Uploaded</label>
        <input id="f-uploaded" type="date" />
      </div>
      <div>
        <label>Upload Status</label>
        <select id="f-upload-status">
          <option value="">— Select —</option>
          <option value="successful">✅ Successful</option>
          <option value="failed">❌ Failed</option>
        </select>
      </div>
      <div>
        <label>Invoice Status</label>
        <select id="f-status">
          <option value="">— Select —</option>
          <option value="inprogress">🔄 In Progress</option>
          <option value="qualitycheck">🔍 Quality Check</option>
          <option value="approved">✅ Approved</option>
          <option value="exported">📤 Exported</option>
          <option value="paid">💰 Paid</option>
        </select>
      </div>
      <div class="form-full">
        <label>Note</label>
        <textarea id="f-note" placeholder="Optional — any details about this upload…"></textarea>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn-primary" onclick="addRecord()">Add Record</button>
    </div>
  </div>

  <!-- Log table -->
  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
      <div class="card-title" style="margin-bottom:0;">// Upload Log</div>
      <button class="btn-fix" onclick="fixOldRecords()" id="fix-btn" title="One-time fix: converts old yes/true upload status to Successful">🔧 Fix Old Records</button>
    </div>
    <!-- Filter bar -->
    <div class="filter-bar">
      <input id="filter-search" type="text" placeholder="🔍 Search vendor..." oninput="applyFilter()" style="min-width:180px;width:auto;" />
      <label style="margin-left:6px;">Month:</label>
      <select id="filter-month" onchange="applyFilter()">
        <option value="">— All —</option>
      </select>
      <select id="filter-year" onchange="applyFilter()">
        <option value="">— All Years —</option>
      </select>
      <button class="btn-clear" onclick="clearFilter()">Clear</button>
      <span class="filter-count" id="filter-count"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Vendor</th>
            <th>Invoice #</th>
            <th>Amount</th>
            <th>Received</th>
            <th>Uploaded</th>
            <th>Upload Status</th>
            <th>Invoice Status</th>
            <th>Note</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="log-body">
          <tr><td colspan="9"><div class="empty"><div class="icon">📋</div>Loading records…</div></td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <h2>✏️ Edit Record</h2>
    <div class="form-grid">
      <div>
        <label>Vendor Name</label>
        <input id="e-vendor" type="text" />
      </div>
      <div>
        <label>Invoice #</label>
        <input id="e-invoice" type="text" />
      </div>
      <div>
        <label>Amount ($)</label>
        <input id="e-amount" type="number" step="0.01" min="0" />
      </div>
      <div>
        <label>Date Received</label>
        <input id="e-received" type="date" />
      </div>
      <div>
        <label>Date Uploaded</label>
        <input id="e-uploaded" type="date" />
      </div>
      <div>
        <label>Upload Status</label>
        <select id="e-upload-status">
          <option value="">— Select —</option>
          <option value="successful">✅ Successful</option>
          <option value="failed">❌ Failed</option>
        </select>
      </div>
      <div>
        <label>Invoice Status</label>
        <select id="e-status">
          <option value="">— Select —</option>
          <option value="inprogress">🔄 In Progress</option>
          <option value="qualitycheck">🔍 Quality Check</option>
          <option value="approved">✅ Approved</option>
          <option value="exported">📤 Exported</option>
          <option value="paid">💰 Paid</option>
        </select>
      </div>
      <div class="form-full">
        <label>Note</label>
        <textarea id="e-note"></textarea>
      </div>
    </div>
    <div class="form-actions" style="margin-top:12px">
      <button class="btn-primary" onclick="saveEdit()">Save Changes</button>
      <button class="btn-cancel"  onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
  import {
    getFirestore, collection, addDoc, getDocs,
    doc, deleteDoc, updateDoc, onSnapshot, orderBy, query
  } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey:            "AIzaSyDGfLmEZWJJdXwgDxsph0BQqeUHpeum6xM",
    authDomain:        "castle-click-tracker.firebaseapp.com",
    projectId:         "castle-click-tracker",
    storageBucket:     "castle-click-tracker.firebasestorage.app",
    messagingSenderId: "499568518560",
    appId:             "1:499568518560:web:fc23f2a2085edeeffe30c5",
    measurementId:     "G-312T70037D"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);
  const col = collection(db, "uploads");

  let editingId = null;
  let allRecords = [];

  const MONTHS = ["January","February","March","April","May","June",
                  "July","August","September","October","November","December"];

  // ── Real-time listener ──────────────────────────────────────
  // No orderBy so old records without createdAt field still load
  onSnapshot(col, snap => {
    allRecords = snap.docs
      .map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    populateFilterDropdowns(allRecords);
    applyFilter();
  });

  // ── Populate month/year dropdowns from existing data ─────────
  function getRecordDate(r) {
    // Try every possible date field, old and new
    const raw = r.dateReceived || r.dateUploaded || r.received || r.uploaded
              || r.daterecieved || r.dateuploaded || r.date || r.Date || "";
    if (raw && raw.includes("-")) return raw; // "YYYY-MM-DD"
    // Fall back to createdAt timestamp
    if (r.createdAt) {
      const d = new Date(r.createdAt);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }
    return "";
  }

  function populateFilterDropdowns(records) {
    const years = new Set();
    records.forEach(r => {
      const d = getRecordDate(r);
      if (d) years.add(d.slice(0, 4));
    });

    const ySel = document.getElementById("filter-year");
    const curY = ySel.value;
    ySel.innerHTML = '<option value="">— All Years —</option>';
    [...years].sort().reverse().forEach(y => {
      ySel.innerHTML += `<option value="${y}" ${y===curY?"selected":""}>${y}</option>`;
    });

    const mSel = document.getElementById("filter-month");
    const curM = mSel.value;
    mSel.innerHTML = '<option value="">— All Months —</option>';
    MONTHS.forEach((name, i) => {
      const val = String(i + 1).padStart(2, "0");
      mSel.innerHTML += `<option value="${val}" ${val===curM?"selected":""}>${name}</option>`;
    });
  }

  // ── Apply filter ─────────────────────────────────────────────
  window.applyFilter = () => {
    const month  = document.getElementById("filter-month").value;
    const year   = document.getElementById("filter-year").value;
    const search = document.getElementById("filter-search").value.trim().toLowerCase();

    let filtered = allRecords.filter(r => {
      // Vendor search
      if (search) {
        const vendor = (r.vendorName || r.vendor || r.Vendor || r.VendorName || "").toLowerCase();
        if (!vendor.includes(search)) return false;
      }
      // Month/year filter
      if (month || year) {
        const d = getRecordDate(r);
        if (!d) return false;
        const [y, m] = d.split("-");
        if (year  && y !== year)  return false;
        if (month && m !== month) return false;
      }
      return true;
    });

    renderTable(filtered);
    renderStats(filtered);

    const countEl = document.getElementById("filter-count");
    if (search || month || year) {
      const mName = month ? MONTHS[parseInt(month)-1] : "";
      const parts = [search ? `"${search}"` : "", mName, year].filter(Boolean).join(" ");
      countEl.textContent = `Showing ${filtered.length} record${filtered.length!==1?"s":""} ${parts ? "for " + parts : ""}`;
    } else {
      countEl.textContent = "";
    }
  };

  // ── Clear filter ─────────────────────────────────────────────
  window.clearFilter = () => {
    document.getElementById("filter-search").value = "";
    document.getElementById("filter-month").value  = "";
    document.getElementById("filter-year").value   = "";
    applyFilter();
  };

  // ── Render table ────────────────────────────────────────────
  function renderTable(records) {
    const tbody = document.getElementById("log-body");
    if (!records.length) {
      tbody.innerHTML = `<tr><td colspan="9"><div class="empty"><div class="icon">📋</div>No records yet — add one above.</div></td></tr>`;
      return;
    }
    tbody.innerHTML = records.map(r => `
      <tr>
        <td class="td-vendor">${esc(r.vendorName || r.vendor || r.Vendor || r.VendorName || "—")}</td>
        <td>${esc(r.invoiceNum || r.invoice || r.Invoice || r.invoiceNumber || "—")}</td>
        <td class="td-amount">${r.amount != null ? "$" + Number(r.amount).toFixed(2) : "—"}</td>
        <td>${fmt(r.dateReceived || r.daterecieved || r.received || "")}</td>
        <td>${fmt(r.dateUploaded || r.dateuploaded || r.uploaded || "")}</td>
        <td>${uploadBadge(r.uploadStatus || r.successfulUpload || r.UploadSuccessful || r.uploadSuccessful)}</td>
        <td>${statusBadge(r.status || r.Status)}</td>
        <td class="td-note">${esc(r.note || r.Note || "—")}</td>
        <td>
          <div class="row-actions">
            <button class="btn-edit"   onclick="window._edit('${r.id}')">✏️ Edit</button>
            <button class="btn-delete" onclick="window._delete('${r.id}')">🗑 Delete</button>
          </div>
        </td>
      </tr>`).join("");
  }

  // ── Stats ───────────────────────────────────────────────────
  function renderStats(records) {
    document.getElementById("stat-total").textContent   = records.length;
    document.getElementById("stat-yes").textContent     = records.filter(r => r.status === "yes").length;
    document.getElementById("stat-no").textContent      = records.filter(r => r.status === "no").length;
    document.getElementById("stat-pending").textContent = records.filter(r => r.status === "pending" || !r.status).length;
  }

  // ── Add ─────────────────────────────────────────────────────
  window.addRecord = async () => {
    const vendor   = document.getElementById("f-vendor").value.trim();
    const invoice  = document.getElementById("f-invoice").value.trim();
    const amount   = document.getElementById("f-amount").value;
    const received = document.getElementById("f-received").value;
    const uploaded = document.getElementById("f-uploaded").value;
    const status   = document.getElementById("f-status").value;
    const note     = document.getElementById("f-note").value.trim();

    if (!vendor) { alert("Vendor name is required."); return; }

    const uploadStatus = document.getElementById("f-upload-status").value;
    await addDoc(col, {
      vendorName:   vendor,
      invoiceNum:   invoice,
      amount:       amount ? parseFloat(amount) : null,
      dateReceived: received,
      dateUploaded: uploaded,
      uploadStatus: uploadStatus,
      status:       status,
      note:         note,
      createdAt:    Date.now()
    });

    ["f-vendor","f-invoice","f-amount","f-received","f-uploaded","f-note"]
      .forEach(id => document.getElementById(id).value = "");
    document.getElementById("f-upload-status").value = "";
    document.getElementById("f-status").value = "";
  };

  // ── Delete ──────────────────────────────────────────────────
  window._delete = async (id) => {
    if (!confirm("Delete this record? This cannot be undone.")) return;
    await deleteDoc(doc(db, "uploads", id));
  };

  // ── Open edit modal ─────────────────────────────────────────
  window._edit = async (id) => {
    const snap = await getDocs(query(col));
    const record = snap.docs.find(d => d.id === id);
    if (!record) return;
    const r = record.data();

    editingId = id;
    document.getElementById("e-vendor").value   = r.vendorName    || "";
    document.getElementById("e-invoice").value  = r.invoiceNum    || "";
    document.getElementById("e-amount").value   = r.amount != null ? r.amount : "";
    document.getElementById("e-received").value = r.dateReceived  || "";
    document.getElementById("e-uploaded").value = r.dateUploaded  || "";
    document.getElementById("e-upload-status").value = r.uploadStatus || r.successfulUpload || "";
    document.getElementById("e-status").value         = r.status        || "";
    document.getElementById("e-note").value     = r.note          || "";

    document.getElementById("edit-modal").classList.add("open");
  };

  // ── Save edit ────────────────────────────────────────────────
  window.saveEdit = async () => {
    if (!editingId) return;
    const amount = document.getElementById("e-amount").value;

    await updateDoc(doc(db, "uploads", editingId), {
      vendorName:   document.getElementById("e-vendor").value.trim(),
      invoiceNum:   document.getElementById("e-invoice").value.trim(),
      amount:       amount ? parseFloat(amount) : null,
      dateReceived: document.getElementById("e-received").value,
      dateUploaded: document.getElementById("e-uploaded").value,
      uploadStatus: document.getElementById("e-upload-status").value,
      status:       document.getElementById("e-status").value,
      note:         document.getElementById("e-note").value.trim(),
    });

    closeModal();
  };

  // ── Fix old records ─────────────────────────────────────────
  window.fixOldRecords = async () => {
    if (!confirm("This will scan all records and fix Upload Status values. Continue?")) return;
    const btn = document.getElementById("fix-btn");
    btn.textContent = "⏳ Fixing…";
    btn.disabled = true;

    const snap = await getDocs(col);
    let count = 0;
    for (const d of snap.docs) {
      const r = d.data();

      // Collect every possible field that might hold the old upload status
      const raw = r.uploadStatus ?? r.successfulUpload ?? r.UploadSuccessful ??
                  r.uploadSuccessful ?? r.status ?? r.Status ?? r["Upload Successful?"] ?? null;

      const yes = [true, "true", "yes", "Yes", "YES", "y", "Y", "✅ Yes", "successful", "Successful"];
      const no  = [false, "false", "no", "No", "NO", "n", "N", "❌ No", "failed", "Failed"];

      let newUpload = null;
      if (yes.includes(raw)) newUpload = "successful";
      if (no.includes(raw))  newUpload = "failed";

      // Only update if uploadStatus isn't already correct
      if (newUpload && r.uploadStatus !== newUpload) {
        await updateDoc(doc(db, "uploads", d.id), { uploadStatus: newUpload });
        count++;
      }
    }

    btn.textContent = `✅ Done (${count} updated)`;
    setTimeout(() => {
      btn.textContent = "🔧 Fix Old Records";
      btn.disabled = false;
    }, 4000);
  };

  // ── Close modal ──────────────────────────────────────────────
  window.closeModal = () => {
    editingId = null;
    document.getElementById("edit-modal").classList.remove("open");
  };

  document.getElementById("edit-modal").addEventListener("click", e => {
    if (e.target === e.currentTarget) closeModal();
  });

  // ── Helpers ──────────────────────────────────────────────────
  function esc(s) {
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  function fmt(d) {
    if (!d) return "—";
    const [y,m,day] = d.split("-");
    return `${m}/${day}/${y}`;
  }
  function uploadBadge(raw) {
    let s = raw;
    if (s === true  || s === "true"  || s === "yes" || s === "Yes") s = "successful";
    if (s === false || s === "false" || s === "no"  || s === "No")  s = "failed";
    const map = {
      successful: ["badge-yes", "✅ Successful"],
      failed:     ["badge-no",  "❌ Failed"],
    };
    const hit = map[s];
    return hit ? `<span class="badge ${hit[0]}">${hit[1]}</span>` : `<span class="badge badge-pending">—</span>`;
  }

  function statusBadge(raw) {
    const map = {
      inprogress:   ["badge-inprogress",   "🔄 In Progress"],
      qualitycheck: ["badge-qualitycheck", "🔍 Quality Check"],
      approved:     ["badge-approved",     "✅ Approved"],
      exported:     ["badge-exported",     "📤 Exported"],
      paid:         ["badge-paid",         "💰 Paid"],
    };
    const hit = map[raw];
    return hit ? `<span class="badge ${hit[0]}">${hit[1]}</span>` : `<span class="badge badge-pending">—</span>`;
  }
</script>
</body>
</html>
